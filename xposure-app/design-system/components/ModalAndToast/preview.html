<!-- @dsCard group="الحوارات والتنبيهات" height=340 width=520 subtitle="نافذة تأكيد + تنبيهات toast" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap">
<div dir="rtl" style="font-family: var(--font-body); padding: var(--space-6); background: var(--surface); display:flex; flex-direction:column; gap: var(--space-6);">

  <div class="xp-modal">
    <h3 class="h3" style="margin:0 0 var(--space-2) 0; color: var(--ink);">تأكيد الرفض</h3>
    <p class="body-sm" style="margin:0 0 var(--space-4) 0; color: var(--ink-muted); line-height:20px;">
      سيُسجَّل هذا القرار في سجل التدقيق ولا يمكن التراجع عنه لاحقاً. هل تريد المتابعة؟
    </p>
    <div style="display:flex; gap: var(--space-3); justify-content:flex-end;">
      <button class="xp-btn xp-btn--secondary">إلغاء</button>
      <button class="xp-btn xp-btn--danger">تأكيد الرفض</button>
    </div>
  </div>

  <div style="display:flex; flex-direction:column; gap: var(--space-2);">
    <div class="xp-toast" style="border-inline-start-color: var(--success);">
      <span style="color:var(--success); font-weight:700;">✓</span>
      <span class="body-sm" style="color:var(--ink);">تم اعتماد التغيير وإنشاء المهمة في Odoo.</span>
    </div>
    <div class="xp-toast" style="border-inline-start-color: var(--danger);">
      <span style="color:var(--danger); font-weight:700;">✕</span>
      <span class="body-sm" style="color:var(--ink);">تعذّر الاتصال بنظام Odoo. أعد المحاولة.</span>
    </div>
  </div>

</div>
<style>
  .xp-modal {
    background: var(--surface-raised); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: var(--space-6); box-shadow: var(--shadow-lg); max-width:420px;
  }
  .xp-btn { font-family: var(--font-body); font-size:14px; font-weight:600; padding: var(--space-2) var(--space-4); border-radius: var(--radius-md); border:none; cursor:pointer; color: var(--ink); }
  .xp-btn--secondary { background: var(--surface-overlay); }
  .xp-btn--danger { background: color-mix(in srgb, var(--danger) 55%, var(--surface)); }

  .xp-toast {
    display:flex; align-items:center; gap: var(--space-3);
    background: var(--surface-raised); border: 1px solid var(--border);
    border-inline-start: 3px solid; border-radius: var(--radius-md);
    padding: var(--space-3) var(--space-4); box-shadow: var(--shadow-sm); max-width:400px;
  }
</style>
