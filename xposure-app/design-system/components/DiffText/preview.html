<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&family=Tajawal:wght@400;500;700&display=swap">
<div dir="rtl" style="font-family: var(--font-body); padding: var(--space-6); background: var(--surface); display:grid; grid-template-columns: 1fr 1fr; gap: var(--space-4);">

  <div class="xp-diff-col">
    <div class="xp-diff-label" style="color: var(--ink-muted);">الإصدار السابق · ECC-1:2018</div>
    <p class="body" style="margin:0; color: var(--ink); line-height:26px;">
      يجب على المنشأة تطبيق آليات تشفير
      <span class="xp-diff xp-diff--del">مناسبة</span>
      لحماية البيانات الحساسة أثناء النقل والتخزين.
    </p>
  </div>

  <div class="xp-diff-col">
    <div class="xp-diff-label" style="color: var(--ink-muted);">الإصدار الجديد · ECC-2:2024</div>
    <p class="body" style="margin:0; color: var(--ink); line-height:26px;">
      يجب على المنشأة تطبيق آليات تشفير
      <span class="xp-diff xp-diff--add">من الدرجة العسكرية (AES-256 أو أعلى)</span>
      لحماية البيانات الحساسة أثناء النقل والتخزين.
    </p>
  </div>

</div>
<style>
  .xp-diff-col {
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: var(--space-5);
  }
  .xp-diff-label {
    font-size: 12px;
    font-weight: 700;
    margin-bottom: var(--space-3);
  }
  .xp-diff {
    border-radius: var(--radius-sm);
    padding: 1px 4px;
    font-weight: 600;
  }
  .xp-diff--del {
    background: color-mix(in srgb, var(--danger) 22%, transparent);
    color: var(--danger);
    text-decoration: line-through;
  }
  .xp-diff--del::before { content: "− "; }
  .xp-diff--add {
    background: color-mix(in srgb, var(--success) 22%, transparent);
    color: var(--success);
    text-decoration: underline;
  }
  .xp-diff--add::before { content: "+ "; }
</style>
